---
# Base package provisioning for masalachai: Docker (lightweight service/container targets)
# and libvirt/KVM (OS-level pentest range VMs). See docs/ for the architecture rationale.
- name: Provision masalachai base packages
  hosts: masalachai_host
  become: true

  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64','amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add ryzil to the docker group
      user:
        name: ryzil
        groups: docker
        append: true

    - name: Install libvirt/KVM stack for the pentest range VMs
      apt:
        name:
          - qemu-kvm
          - libvirt-daemon-system
          - libvirt-clients
          - bridge-utils
          - virtinst
          - cpu-checker
        state: present

    - name: Add ryzil to the libvirt group
      user:
        name: ryzil
        groups: libvirt
        append: true

    - name: Ensure libvirtd is enabled and running
      systemd:
        name: libvirtd
        enabled: true
        state: started

    - name: Verify KVM acceleration is usable
      command: kvm-ok
      register: kvm_check
      changed_when: false
      failed_when: "'KVM acceleration can be used' not in kvm_check.stdout"
