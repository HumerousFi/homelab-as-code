[coldcoffee_host]
coldcoffee ansible_connection=local tailscale_ip=100.92.165.30

[masalachai_host]
masalachai ansible_host=masalachai ansible_user=ryzil tailscale_ip=100.115.9.67

# Both machines - used by fleet-wide playbooks (e.g. node_exporter) that
# apply the same role to every box regardless of what else runs on it.
[fleet:children]
coldcoffee_host
masalachai_host

[kali_attack]
# Reaches the range's attack box via the "kali-attack" alias in coldcoffee's
# ~/.ssh/config (ProxyJump through masalachai) - Ansible's ssh connection
# plugin honors the system ssh config automatically.
kali-attack ansible_host=kali-attack ansible_user=kali

[all:vars]
ansible_python_interpreter=/usr/bin/python3
