[coldcoffee_host]
coldcoffee ansible_connection=local

[masalachai_host]
masalachai ansible_host=masalachai ansible_user=ryzil

[kali_attack]
# Reaches the range's attack box via the "kali-attack" alias in coldcoffee's
# ~/.ssh/config (ProxyJump through masalachai) - Ansible's ssh connection
# plugin honors the system ssh config automatically.
kali-attack ansible_host=kali-attack ansible_user=kali

[all:vars]
ansible_python_interpreter=/usr/bin/python3
